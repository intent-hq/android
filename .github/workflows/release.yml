name: Unsigned release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo 'The tag must equal v<appVersion> from gradle.properties.' >&2
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build unsigned release files
        run: ./gradlew build ktlintCheck detekt test :app:bundleRelease :app:assembleRelease -Ptailcat.enabled=false
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.10.1
          args: --latest --output release-notes.md
      - name: Upload unsigned files and changelog
        uses: actions/upload-artifact@v6
        with:
          name: intent-android-${{ github.ref_name }}-unsigned
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release-unsigned.apk
            release-notes.md
